<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#122a32">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Dealapp | Product Process 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#122a32;--teal:#147d78;--teal-soft:#e3f3ef;--teal-ink:#0f5f5b;--lime:#c9f27a;
  --paper:#f5f7f4;--card:#fff;--field:#fff;--ink:#182c31;--muted:#5f7175;--line:#e0e7e4;--soft:#f3f6f4;--bd:#cfdad6;--rule:#b9c7c4;
  --warn-bg:#fff4e0;--warn-ink:#7a520f;--stop-bg:#fdeceb;--stop-ink:#9b2c22;--r:14px
}
:root[data-theme=dark]{
  --navy:#0b181c;--teal-soft:#123a37;--teal-ink:#8fe0d6;--paper:#0f1719;--card:#162226;--field:#111b1e;--ink:#e3ecea;--muted:#9fb0b2;
  --line:#28383c;--soft:#1c2a2e;--bd:#33464a;--rule:#4a5e62;--warn-bg:#3a2d12;--warn-ink:#f2cf8a;--stop-bg:#3d1c19;--stop-ink:#f3a59c;color-scheme:dark
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #7bd7c4;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.top{background:var(--navy);color:#fff;padding:12px clamp(16px,3vw,32px);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--lime);color:#122a32;display:grid;place-items:center;font-weight:700}
.brand b{display:block;font-size:15px}.brand small{display:block;font-size:12px;color:#b7c9ca}
.top-actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;line-height:1.3;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.ghost{background:transparent;border-color:#47636a;color:#fff}
.btn.ghost:hover{background:#1d3a42}
.btn.icon{padding:8px 11px}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:#106a66}
.btn[disabled]{opacity:.4;cursor:not-allowed}

.wrap{max-width:1180px;margin:0 auto;padding:20px clamp(16px,3vw,32px) 48px}
.intro h1{font-size:clamp(22px,3vw,28px);margin:0 0 4px;line-height:1.3}
.intro p{margin:0 0 16px;color:var(--muted);max-width:720px}
.landing{display:none}
body.landing-on .landing{display:block}
body.landing-on main.wrap,body.landing-on #viewSwitch,body.landing-on #undoBtn,body.landing-on #redoBtn,body.landing-on #newBtn,body.landing-on #editBtn{display:none!important}
.brand{cursor:pointer}
.l-hero{background:var(--navy);color:#fff;position:relative;overflow:hidden;padding:clamp(40px,8vw,96px) clamp(16px,5vw,64px) 120px}
.l-what{font-size:22px;margin:56px 0 0;color:#fff}
.l-hero::after{content:"";position:absolute;inset-inline-end:-160px;top:-120px;width:520px;height:520px;border-radius:50%;border:56px solid rgba(255,255,255,.04);pointer-events:none}
.l-in{max-width:1080px;margin:0 auto;position:relative;z-index:1}
.l-eye{display:flex;align-items:center;gap:10px;color:var(--lime);font-size:13px;font-weight:600;letter-spacing:.02em;margin-bottom:18px}
.l-eye::before{content:"";width:28px;height:2px;background:var(--lime)}
.l-hero h1{font-size:clamp(32px,5.4vw,58px);line-height:1.15;margin:0 0 18px;max-width:780px}
.l-hero p{font-size:clamp(16px,1.6vw,19px);color:#c9d8d8;max-width:680px;margin:0 0 28px}
.l-cta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px}
.l-cta .go{background:var(--lime);color:#122a32;border:0;border-radius:12px;padding:14px 26px;font-weight:700;font-size:17px}
.l-cta .go:hover{filter:brightness(.95)}
.l-cta .sec{background:transparent;color:#fff;border:1px solid #47636a;border-radius:12px;padding:14px 22px;font-weight:600;font-size:16px}
.l-cta .sec:hover{background:#1d3a42}
.l-phases{display:flex;gap:8px;flex-wrap:wrap;padding:0;margin:0;list-style:none}
.l-phases li{border:1px solid #31525a;border-radius:99px;padding:6px 14px;font-size:14px;color:#dbe7e6}
.l-phases b{color:var(--lime);margin-inline-end:6px}
.l-body{max-width:calc(1080px + 2 * clamp(16px,5vw,64px));margin:0 auto;padding:0 clamp(16px,5vw,64px) 64px}
.l-body .l-cards{margin-top:-96px;position:relative;z-index:2}
.l-body h2{font-size:22px;margin:0 0 14px}
.l-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:40px}
.l-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 12px 32px rgba(10,30,35,.12)}
.l-card .ic{width:36px;height:36px;border-radius:10px;background:var(--teal-soft,#e3f3f0);color:var(--teal);display:grid;place-items:center;font-weight:700;margin-bottom:10px}
.l-card h3{font-size:16px;margin:0 0 6px}.l-card p{margin:0;color:var(--muted);font-size:14.5px}
.l-how{list-style:none;padding:0;margin:0 0 40px;display:grid;gap:10px;counter-reset:h}
.l-how li{counter-increment:h;display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.l-how li::before{content:counter(h);flex:none;width:28px;height:28px;border-radius:50%;background:var(--navy);color:var(--lime);display:grid;place-items:center;font-weight:700;font-size:14px}
.l-note{border:1px solid var(--line);border-inline-start:4px solid var(--teal);border-radius:12px;background:var(--card);padding:16px 18px}
.l-note h3{margin:0 0 4px;font-size:16px}.l-note p{margin:0;color:var(--muted)}
@media (max-width:760px){.l-cards{grid-template-columns:1fr}.l-what{margin-top:40px}}
.localbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:820px;margin:0 auto 14px;padding:8px 12px;border-radius:10px;background:var(--soft);border:1px dashed var(--bd);font-size:13px;color:var(--muted)}
.localbar[hidden]{display:none}
.localbar .btn{padding:4px 10px;font-size:13px}
.intro .note{max-width:720px;margin:0 0 18px;padding:12px 14px;border:1px solid var(--line);border-inline-start:4px solid var(--teal);border-radius:10px;background:var(--card);font-size:14px;line-height:1.7}

/* Phase bar */
.phases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:16px}
.phase{display:flex;gap:10px;align-items:center;text-align:start;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px}
.phase svg{flex:none}
.phase b{display:block;font-size:14px}
.phase span{display:block;font-size:12px;color:var(--muted)}
.phase.current{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.phase.empty{opacity:.5}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}

/* Flow */
.flow{list-style:none;margin:0;padding:0}
.ph-label{font-size:13px;font-weight:600;color:var(--muted);margin:18px 4px 8px}
.ph-label:first-child{margin-top:0}
.node{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}
.node+.node::before,.node+.ph-label+.node::before{content:"";position:absolute;inset-inline-start:27px;top:-15px;height:14px;border-inline-start:2px solid var(--rule)}
.node.is-active{border-color:var(--teal);box-shadow:0 0 0 3px #7bd7c43d}
.head{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;background:none;border:0;text-align:start}
.num{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted);flex:none;background:var(--card)}
.is-done .num{background:var(--teal);border-color:var(--teal);color:#fff}
.is-active .num{border-color:var(--teal);color:var(--teal)}
.q{flex:1;min-width:0}
.q b{display:block;font-size:16px;line-height:1.4}
.q small{display:block;font-size:13px;color:var(--muted)}
.ans{font-size:14px;color:var(--teal-ink);background:var(--teal-soft);border-radius:99px;padding:3px 10px;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.body{padding:0 14px 14px 14px;padding-inline-start:54px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--bd);background:var(--field);border-radius:10px;padding:8px 14px;font-size:15px;text-align:start}
.opt small{display:block;font-size:12px;color:var(--muted)}
.opt[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.opt[aria-pressed="true"] small{color:#d8f1ec}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:4px}
.field.full{grid-column:1/-1}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field label span{font-weight:400;color:var(--muted);font-size:13px}
.field input,.field textarea{width:100%;border:1px solid var(--bd);border-radius:10px;padding:9px 12px;background:var(--field);font-size:15px}
.field textarea{min-height:72px;resize:vertical}
.sub{font-size:14px;font-weight:600;margin:14px 0 8px}
.checks{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.checks li+li{border-top:1px solid var(--line)}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;font-size:15px;cursor:pointer}
.checks input{width:18px;height:18px;margin-top:4px;accent-color:var(--teal);flex:none}
.done-rule{font-size:13px;color:var(--muted);margin-top:12px}
.done-rule b{color:var(--ink);font-weight:600}
.actions-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.term{border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-size:15px}
.term b{display:block}
.term.stop{background:var(--stop-bg);color:var(--stop-ink)}
.term.end{background:var(--teal-soft);color:var(--teal-ink)}
.term.warn{background:var(--warn-bg);color:var(--warn-ink)}
.term .btn{margin-top:8px}

/* Text editor */
.editor{display:none}
body.editing .wrap>*:not(.editor){display:none}
body.editing .editor{display:block}
.ed-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.ed-head h1{font-size:24px;margin:0}
.ed-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.ed-bar{position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);margin-bottom:12px}
.ed-bar .count{font-size:13px;color:var(--muted)}
.ed-group{font-size:14px;font-weight:600;color:var(--muted);margin:18px 2px 8px}
.ed-node{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.ed-node summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center}
.ed-node summary::-webkit-details-marker{display:none}
.ed-node summary::before{content:"▸";color:var(--muted)}
[dir=rtl] .ed-node summary::before{content:"◂"}
.ed-node[open] summary::before{content:"▾"}
.ed-node .chg{font-size:12px;font-weight:600;color:var(--warn-ink);background:var(--warn-bg);border-radius:99px;padding:1px 8px}
.ed-rows{padding:0 14px 14px;display:grid;gap:10px}
.ed-row label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.ed-row input{width:100%;border:1px solid var(--bd);border-radius:10px;padding:8px 12px;background:var(--field);font-size:15px}
.ed-row input.changed{border-color:var(--warn-ink);box-shadow:0 0 0 2px var(--warn-bg)}
.ed-row .orig{font-size:12px;color:var(--muted);margin-top:3px}
.ed-row.gone input,.ed-order li.gone span{opacity:.5;text-decoration:line-through}
.ed-line .del{min-width:34px}
.lock{font-size:13px;opacity:.6;padding:0 6px}
.ed-add input{border-style:dashed}
.ed-line{display:flex;gap:6px;align-items:center}
.ed-line input{flex:1}
.ed-line .btn{padding:6px 9px;font-size:11px}
.ed-order{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ed-order li{display:flex;align-items:center;gap:6px;padding:6px 8px;font-size:14px}
.ed-order li+li{border-top:1px solid var(--line)}
.ed-order li span{flex:1}
.ed-order .btn{padding:3px 8px;font-size:11px}
.ed-token{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.ed-token ol{margin:6px 0;padding-inline-start:20px}
.ed-token input{width:100%;border:1px solid var(--bd);border-radius:10px;padding:8px 12px;background:var(--field);color:var(--ink);margin:6px 0;font-family:monospace;direction:ltr}
.ed-token a{color:inherit;font-weight:600}
/* Layout per view */
body[data-view=steps] .intro,body[data-view=steps] .phases{max-width:820px;margin-inline:auto}
.layout.view-steps{grid-template-columns:minmax(0,820px);justify-content:center}
.view-steps .side{display:none}
.final{margin-top:4px}
.final .sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px;margin-bottom:12px}
.final .stack{flex-direction:row;flex-wrap:wrap}
.view-flow .final,.view-dd .final{margin-top:16px}
/* Side */
.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h2{font-size:15px;margin:0 0 10px}
.sum{margin:0}
.sum div{padding:7px 0;border-bottom:1px solid var(--line)}
.sum div:last-child{border:0}
.sum dt{font-size:12px;color:var(--muted);font-weight:600}
.sum dd{margin:0;font-size:14px;overflow-wrap:anywhere}
.sum .empty{color:var(--muted)}
.next{background:var(--teal-soft);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px;color:var(--teal-ink)}
.next b{display:block;color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:8px}
.saved{font-size:12px;color:var(--muted);margin-top:8px}

.view-switch{display:inline-flex;background:#1d3a42;border-radius:10px;padding:3px;gap:2px}
.view-switch button{border:0;background:none;color:#cfe0df;border-radius:8px;padding:6px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.view-switch button[aria-pressed="true"]{background:var(--lime);color:#122a32}
.v-flow,.v-dd{display:none}
.view-flow .v-flow,.view-dd .v-dd{display:block}
.view-flow .v-steps,.view-dd .v-steps{display:none}
.detail .node{margin:0}
.detail .head{cursor:default}
/* flowchart canvas */
.canvas{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.c-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
.c-tools .btn{padding:5px 10px;font-size:13px}
.c-zoom{min-width:48px;text-align:center;font-size:13px;font-weight:600;color:var(--muted)}
.c-vp{height:calc(100vh - 300px);min-height:480px;overflow:auto;cursor:grab;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px}
.c-vp.drag{cursor:grabbing;user-select:none}
.c-sizer{position:relative;overflow:hidden;margin:0 auto;direction:ltr}
.c-stage{width:560px;padding:24px 0;transform-origin:0 0;display:flex;flex-direction:column;align-items:center}
[dir=rtl] .c-stage{direction:rtl}
.c-arrow{width:2px;height:22px;background:var(--rule);position:relative;flex:none}
.c-arrow:after{content:"";position:absolute;bottom:-2px;left:-4px;border:5px solid transparent;border-top:6px solid var(--rule);border-bottom:0}
.c-box{width:320px;border:1.5px solid var(--bd);background:var(--card);border-radius:12px;padding:9px 14px;text-align:center}
.c-box b{display:block;font-size:15px}.c-box small{display:block;font-size:12px;color:var(--muted)}
.c-dia{position:relative;width:240px;height:104px;display:grid;place-items:center;text-align:center;padding:0 46px;background:none;border:0}
.c-dia svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.c-dia polygon{fill:var(--card);stroke:var(--bd);stroke-width:1.5;vector-effect:non-scaling-stroke}
.c-dia span{position:relative;font-weight:600;font-size:14px;line-height:1.3}
.c-dia small{display:block;font-weight:400;font-size:12px;color:var(--teal-ink)}
.is-done.c-box{border-color:var(--teal);background:var(--teal-soft)}
.is-done.c-dia polygon{stroke:var(--teal);fill:var(--teal-soft)}
.is-active.c-box,.is-active.c-dia polygon{border-color:var(--teal);stroke:var(--teal);stroke-width:2.5}
.is-todo{opacity:.5}
.sel.c-box{box-shadow:0 0 0 3px #7bd7c4}
.sel.c-dia polygon{stroke:#7bd7c4;stroke-width:3}
.c-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:480px;margin-top:8px}
.c-chips .opt{font-size:13px;padding:5px 11px}
.c-term{border-radius:99px;padding:7px 18px;font-weight:600;font-size:14px;background:var(--navy);color:#fff}
.c-term.stop{background:var(--stop-bg);color:var(--stop-ink)}.c-term.warn{background:var(--warn-bg);color:var(--warn-ink)}.c-term.end{background:var(--teal);color:#fff}
/* double diamond */
.dd{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.dd-svg{width:100%;height:auto;display:block}
.dd-svg .ph{cursor:pointer;stroke:var(--card);stroke-width:3}
.dd-svg .cur{stroke:var(--teal)}
.dd-svg text{fill:var(--ink);font-family:inherit;pointer-events:none}
.dd-svg text.m{fill:var(--muted)}.dd-svg text.on{fill:#fff}
.dd-svg .ax{stroke:var(--rule);stroke-width:1.5}
.dd-cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.dd-col{border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.dd-col.current{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.dd-col h3{font-size:15px;margin:0}.dd-col p{font-size:13px;color:var(--muted);margin:2px 0 8px}
.dd-step{display:flex;gap:8px;align-items:center;width:100%;text-align:start;background:none;border:0;border-radius:8px;padding:6px;font-size:14px}
.dd-step:hover{background:var(--soft)}
.dd-step.sel{background:var(--teal-soft);font-weight:600}
.dd-step .num{width:24px;height:24px;font-size:12px}
.dd-empty{font-size:13px;color:var(--muted)}
@media (max-width:980px){.dd-cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.dd-cols{grid-template-columns:1fr}.top-actions{width:100%}.view-switch{order:-1;width:100%;display:flex}.view-switch button{flex:1}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:12px;padding:10px 14px;display:none;align-items:center;gap:12px;z-index:50;font-size:14px;box-shadow:0 8px 30px #0003}
.toast.show{display:flex}
.toast button{background:none;border:0;color:var(--lime);font-weight:600;text-decoration:underline}

@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}.side{position:static;display:grid;grid-template-columns:1fr 1fr}}
@media (max-width:640px){
  .final .sum{grid-template-columns:1fr}
  .phases{grid-template-columns:repeat(2,minmax(0,1fr))}
  .side{grid-template-columns:1fr}
  .fields{grid-template-columns:1fr}
  .body{padding-inline-start:14px}
  .ans{max-width:40%}
}
@media print{.top-actions,.side .stack,.toast,.phases{display:none!important}.layout{display:block}.node{break-inside:avoid}}
</style>
</head>
<body>
<header class="top">

/* ---------- Auto-update (beats the GitHub Pages cache) ---------- */
const APP_V='2026.11.10-20';
(function(){
  async function check(){
    try{
      const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;
      const v=(await r.json()).v;if(!v||v===APP_V)return;
      let tried='';try{tried=sessionStorage.getItem('dl-v-tried')||''}catch(e){}
      if(tried===v)return;
      try{sessionStorage.setItem('dl-v-tried',v)}catch(e){}
      const u=new URL(location.href);u.searchParams.set('v',v);location.replace(u.toString());
    }catch(e){}
  }
  check();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()});
})();

const $=id=>document.getElementById(id);
const u=()=>UI[S.lang];
const L=o=>typeof o==='string'?o:(o[S.lang]??o.ar);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const filled=v=>v!==undefined&&v!==null&&String(v).trim()!=='';

/* ---------- Path ---------- */
function route(){
  const a=S.a,ids=['type'];let term=null;
  if(!a.type)return {ids,term};
  ids.push('source');
  const path=a.type==='bug'?'bug':a.type==='cr'?'cr':'full';
  for(const id of ORDER[path]){
    if(id==='type'||id==='source'||hid('step.'+id))continue;
    if(id==='validate'&&a.evidence!=='assumption')continue;
    if(id==='close'&&a.result!=='yes')continue;
    ids.push(id);
    if(id==='validate'&&a.validate==='none')return {ids,term:'stop'};
    if(id==='result'&&a.result==='no')return {ids,term:'loop'};
    if(id==='result'&&a.result==='later')return {ids,term:'later'};
    if(id==='brec'&&a.brec==='yes')return {ids,term:'bugloop'};
  }
  return {ids,term:path==='bug'?(a.brec==='no'?'end':null):'end'};
}
function visibleGroups(n){return (n.groups||[]).filter(g=>!g.when||Object.entries(g.when).every(([k,v])=>S.a[k]===v))}
function visibleFields(n){return (n.fields||[]).filter(f=>!f.extra&&(!f.when||Object.entries(f.when).every(([k,v])=>S.a[k]===v)))}
function isDone(id){
  const n=N[id];
  if(n.kind==='choice')return filled(S.a[id])&&(S.a[id]!=='other'||(filled(S.a[id+'Other'])&&!!S.done[id]));
  const c=S.checks[id]||[];const checksOk=(n.checks||[]).every((_,i)=>c[i]||hid(id+'.c.'+i));
  if(n.kind==='task')return checksOk;
  const groupsOk=visibleGroups(n).every(g=>!g.req||(filled(S.a[g.id])&&(S.a[g.id]!=='other'||filled(S.a[g.id+'Other']))));
  const fieldsOk=visibleFields(n).every(f=>!f.req||filled(S.a[f.id]));
  if(n.kind==='multi')return !!S.done[id]&&checksOk&&(!(S.a[id]||[]).includes('other')||filled(S.a[id+'Other']));
  return !!S.done[id]&&groupsOk&&fieldsOk&&checksOk;
}
function canConfirm(id){
  const n=N[id];const c=S.checks[id]||[];
  if(n.kind==='choice')return filled(S.a[id+'Other']);
  if(n.kind==='multi'&&(S.a[id]||[]).includes('other')&&!filled(S.a[id+'Other']))return false;
  return (n.checks||[]).every((_,i)=>c[i]||hid(id+'.c.'+i))&&visibleGroups(n).every(g=>!g.req||(filled(S.a[g.id])&&(S.a[g.id]!=='other'||filled(S.a[g.id+'Other']))))&&visibleFields(n).every(f=>!f.req||filled(S.a[f.id]))&&(n.kind!=='multi'||(S.a[id]||[]).length>0);
}
function shown(){
  const {ids,term}=route();const out=[];let active=null;
  for(const id of ids){out.push(id);if(!isDone(id)){active=id;break}}
  return {list:out,active,term:active?null:term,all:ids};
}

/* ---------- Render ---------- */
function answerText(id){
  const n=N[id],a=S.a;
  if(n.kind==='choice'){if(a[id]==='other'&&filled(a[id+'Other']))return a[id+'Other'];const o=(n._opts||n.opts).find(x=>x[0]===a[id]);return o?L(o[1]):''}
  if(n.kind==='multi')return (a[id]||[]).map(v=>{if(v==='other'&&filled(a[id+'Other']))return a[id+'Other'];const o=(n._opts||n.opts).find(x=>x[0]===v);return o?L(o[1]):v}).join('، ');
  if(id==='source')return [a.title,reqText()].filter(Boolean).join(' · ');
  if(id==='kpi')return a.hasKpi==='yes'?[a.kpiName,[a.baseline,a.target].filter(Boolean).join(' ← ')].filter(Boolean).join(' · '):(a.outcome||'');
  if(id==='launch')return a.measureDate?`${u().sMeasure}: ${a.measureDate}`:'';
  if(id==='close')return a.actual||'';
  if(n.kind==='task'){const c=S.checks[id]||[],vis=n.checks.map((_,i)=>i).filter(i=>!hid(id+'.c.'+i));return `${vis.filter(i=>c[i]).length}/${vis.length}`}
  return '';
}
function reqText(){const gs=N.source.groups,a=S.a,top=optLabel(gs.find(g=>g.id==='requester'),a.requester);
  const sub=a.requester==='user'?optLabel(gs.find(g=>g.id==='requesterUser'),a.requesterUser):a.requester==='team'?optLabel(gs.find(g=>g.id==='requesterTeam'),a.requesterTeam):'';
  return sub?`${top}: ${sub}`:top}
function optLabel(g,v){if(v==='other'&&filled(S.a[g.id+'Other']))return S.a[g.id+'Other'];const o=(g._opts||g.opts).find(x=>x[0]===v);return o?L(o[1]):''}

function diamond(frac){ // small diamond filling bottom-up with progress
  const h=Math.round(24*(1-frac)),cid='dc'+h;
  return `<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><clipPath id="${cid}"><rect x="0" y="${h}" width="24" height="24"/></clipPath><polygon points="12,1 23,12 12,23 1,12" fill="var(--teal)" clip-path="url(#${cid})"/><polygon points="12,1 23,12 12,23 1,12" fill="none" stroke="var(--teal)" stroke-width="1.5"/></svg>`;
}

function termHTML(term){
  const t=u();
  if(term==='stop')return `<li class="term stop"><b>${t.stopT}</b>${t.stopX}</li>`;
  if(term==='end')return `<li class="term end"><b>${t.endT}</b>${t.endX}</li>`;
  if(term==='later')return `<li class="term warn"><b>${t.laterT}</b>${t.laterX}</li>`;
  if(term==='loop')return `<li class="term warn"><b>${t.loopT}</b>${t.loopX}<br><button type="button" class="btn primary" id="loopBtn">${t.loopBtn}</button></li>`;
  if(term==='bugloop')return `<li class="term warn"><b>${t.bugLoopT}</b>${t.bugLoopX}<br><button type="button" class="btn primary" id="bugLoopBtn">${t.bugLoopBtn}</button></li>`;
  return '';
}

  const t=u(),tok=getTok();if(!tok){tokenBox();return}

  const api=`https://api.github.com/repos/${REPO}/contents/${CFILE}`,hd={Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'};
  try{
    let sha=null,remote={ar:{},en:{},order:{},hidden:[],added:{}};
    const g=await fetch(api+'?ref=main&t='+Date.now(),{headers:hd,cache:'no-store'});
    if(g.status===401||g.status===403){try{localStorage.removeItem(TOKKEY)}catch(e){}throw new Error(g.status+' — token')}
    if(g.ok){const j=await g.json();sha=j.sha;try{const d=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));remote={ar:d.ar||{},en:d.en||{},order:d.order||{},hidden:d.hidden||[],added:d.added||{}}}catch(e){}}
    const next={ar:{...remote.ar},en:{...remote.en}},nord={...remote.order};
    const nadd={};Object.entries(remote.added).forEach(([lk,arr])=>{const f=arr.filter(a=>!ADD_DEL.has(lk+'|'+a.v));if(f.length)nadd[lk]=f});
    Object.entries(ADD_DRAFT).forEach(([lk,arr])=>{if(arr.length)nadd[lk]=(nadd[lk]||[]).concat(arr)});
    const nh=new Set(remote.hidden);Object.entries(DRAFT_HID).forEach(([k,v])=>{v?nh.add(k):nh.delete(k)});
    Object.entries(DRAFT_ORD).forEach(([k,o])=>{if(o.join()===DEF_ORD[k].join())delete nord[k];else nord[k]=o});
    ['ar','en'].forEach(x=>Object.entries(DRAFT[x]).forEach(([k,v])=>{if(v===DEFAULTS[k][x])delete next[x][k];else next[x][k]=v}));
    const body={message:'Update page texts from the in-page editor',content:b64(JSON.stringify({v:1,ar:next.ar,en:next.en,order:nord,hidden:[...nh],added:nadd},null,2)+'\n'),branch:'main'};if(sha)body.sha=sha;
    const r=await fetch(api,{method:'PUT',headers:{...hd,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.status===401||r.status===403){try{localStorage.removeItem(TOKKEY)}catch(e){}throw new Error(r.status+' — token')}
    if(!r.ok)throw new Error(r.status+' '+((await r.json().catch(()=>({}))).message||''));
    REMOTE={ar:next.ar,en:next.en,order:nord,hidden:[...nh],added:nadd};SAVED=next;SAVED_ORD=nord;SAVED_HID=nh;ADD_SAVED=nadd;ADD_DRAFT={};ADD_DEL=new Set();DRAFT={ar:{},en:{}};DRAFT_ORD={};DRAFT_HID={};ED_UNDO=[];ED_REDO=[];applyTexts();renderEditor();toast(t.edSaved);
  }catch(e){btn.disabled=false;btn.textContent=t.edSave;toast(t.edFail(e.message));if(!getTok())tokenBox()}
}
document.querySelector('.brand').onclick=openLanding;
$('editBtn').onclick=()=>{EDITING=!EDITING;render();scrollTo({top:0})};

/* ---------- Actions ---------- */
function toast(msg,canUndo){if(!canUndo||msg!==u().edTeamDone)window._teamUndo=false;$('toastMsg').textContent=msg;$('toastUndo').style.display=canUndo?'':'none';$('toast').classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>$('toast').classList.remove('show'),canUndo?7000:2500)}
$('toastUndo').onclick=()=>{if(window._teamUndo){window._teamUndo=false;teamResetUndo()}else EDITING?edUndo():undo();$('toast').classList.remove('show')};
$('newBtn').onclick=()=>{snap();S.a={};S.done={};S.checks={};S.open=null;S.sel=null;save();render();scrollTo({top:0,behavior:'smooth'});toast(u().cleared,true)};
$('viewSwitch').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.view=b.dataset.view;save();render();if(S.view==='flow')requestAnimationFrame(()=>{fitWidth();centerCanvas(false)})});
$('langBtn').onclick=()=>{S.lang=S.lang==='ar'?'en':'ar';save();render()};
$('themeBtn').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';S.theme=dark?'light':'dark';save();render()};

function summaryText(){
  const t=u(),{ids,term}=route(),out=[t.exportTitle,'='.repeat(32)];let i=0;
  N.source._fields.filter(f=>f.extra&&S.a[f.id]).forEach(f=>out.push(`${L(f.label)}: ${S.a[f.id]}`));
  ids.forEach(id=>{const n=N[id];i++;const ans=isDone(id)?answerText(id):'—';out.push('',`${i}. ${L(n.q)}`,`   ${ans}`,`   ${t.owner}: ${L(n.owner)}${n.with?' · '+t.withL+': '+L(n.with):''}`);
    visibleFields(n).forEach(f=>{if(S.a[f.id]&&!['title','kpiName','baseline','target'].includes(f.id))out.push(`   ${L(f.label)}: ${S.a[f.id]}`)});
    visibleGroups(n).forEach(g=>{if(S.a[g.id])out.push(`   ${L(g.label)}: ${optLabel(g,S.a[g.id])}`)});
    if(n.checks){const c=S.checks[id]||[];n.checks.forEach((k,j)=>{if(!hid(id+'.c.'+j))out.push(`   [${c[j]?'x':' '}] ${L(k)}`)})}});
  if(term){const m={stop:t.stopT,end:t.endT,loop:t.loopT,later:t.laterT,bugloop:t.bugLoopT};if(!shown().active)out.push('',`→ ${m[term]}`)}
  return out.join('\n');
}
$('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(summaryText());toast(u().copied)}catch(e){toast(e.message)}};
$('dlBtn').onclick=()=>{const b=new Blob([summaryText()],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(S.a.title||'dealapp-request').replace(/[\\/:*?"<>|]/g,'-')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast(u().downloaded)};
$('printBtn').onclick=()=>window.print();

loadTexts().finally(render);
</script>
