<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#122a32">
<title>Dealapp | Product Process 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#122a32;--teal:#147d78;--teal-soft:#e3f3ef;--lime:#c9f27a;
  --paper:#f5f7f4;--card:#fff;--ink:#182c31;--muted:#5f7175;--line:#e0e7e4;--soft:#f3f6f4;
  --warn-bg:#fff4e0;--warn-ink:#7a520f;--stop-bg:#fdeceb;--stop-ink:#9b2c22;
  --r:14px;--gap:16px;--field:#fff;--bd:#cfdad6;--rule:#b9c7c4;--dotc:#dde3e0;--teal-ink:#0f5f5b
}
:root[data-theme=dark]{--navy:#0b181c;--paper:#0f1719;--card:#162226;--ink:#e3ecea;--muted:#9fb0b2;--line:#28383c;--soft:#1c2a2e;--teal-soft:#123a37;--warn-bg:#3a2d12;--warn-ink:#f2cf8a;--stop-bg:#3d1c19;--stop-ink:#f3a59c;--field:#111b1e;--bd:#33464a;--rule:#4a5e62;--dotc:#24363a;--teal-ink:#8fe0d6;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #7bd7c4;outline-offset:2px}
.step-btn{position:relative}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Top bar */
.top{background:var(--navy);color:#fff;padding:12px clamp(16px,3vw,32px);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:10px;background:var(--lime);color:var(--navy);display:grid;place-items:center;font-weight:700;flex:none}
.brand b{display:block;font-size:15px}
.brand small{display:block;font-size:12px;color:#b7c9ca}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--field);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;line-height:1.3;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.ghost{background:transparent;border-color:#47636a;color:#fff}
.btn.ghost:hover{background:#1d3a42}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:#106a66}
.btn.link{border:0;background:none;padding:4px 0;color:var(--teal);text-decoration:underline;text-underline-offset:3px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.icon{padding:8px 11px;font-size:15px;line-height:1.1}

/* Intro strip */
.intro{max-width:1280px;margin:0 auto;padding:20px clamp(16px,3vw,32px) 0}
.intro h1{font-size:clamp(22px,3vw,28px);margin:0 0 4px;line-height:1.3}
.intro p{margin:0;color:var(--muted);font-size:15px;max-width:760px}

/* Layout */
.app{max-width:1280px;margin:0 auto;padding:16px clamp(16px,3vw,32px) 48px;display:grid;grid-template-columns:270px minmax(0,1fr) 300px;gap:var(--gap);align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}

/* Stepper */
.stepper{padding:14px;position:sticky;top:12px}
.progress{margin:0 0 12px}
.progress-row{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;background:var(--teal);transition:width .2s}
.path-tag{display:inline-block;font-size:12px;font-weight:600;background:var(--teal-soft);color:var(--teal-ink);border-radius:99px;padding:2px 10px;margin-bottom:10px}
.phase{font-size:12px;font-weight:600;color:var(--muted);margin:12px 4px 4px}
.steps{list-style:none;margin:0;padding:0}
.step-btn{width:100%;display:flex;align-items:center;gap:10px;text-align:start;background:none;border:0;border-radius:10px;padding:8px;font-size:14px}
.step-btn:hover{background:var(--soft)}
.step-btn[aria-current="step"]{background:var(--teal-soft);font-weight:600}
.dot{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;color:var(--muted);background:var(--field)}
.is-done .dot{background:var(--teal);border-color:var(--teal);color:#fff}
.is-progress .dot{border-color:var(--teal);color:var(--teal)}
.is-locked{opacity:.45}
.is-locked .dot{border-style:dashed}

/* Main step card */
.card-head{padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.kicker{font-size:13px;color:var(--teal);font-weight:600}
.card-head h2{margin:2px 0 6px;font-size:22px;line-height:1.35}
.card-head p{margin:0;color:var(--muted);font-size:15px}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.meta div{background:var(--soft);padding:12px 16px}
.meta small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.meta span{font-size:14px}
.card-body{padding:20px 22px}
.section-label{font-size:15px;font-weight:600;margin:0 0 10px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:22px}
.field.full{grid-column:1/-1}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field .opt-tag{font-weight:400;color:var(--muted);font-size:13px}
.field input,.field textarea{width:100%;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;background:var(--field);font-size:15px}
.field textarea{min-height:84px;resize:vertical}
.field .hint{font-size:13px;color:var(--muted);margin-top:4px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{border:1px solid var(--bd);background:var(--field);border-radius:99px;padding:7px 14px;font-size:14px}
.choice[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
.checks{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.checks li+li{border-top:1px solid var(--line)}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;font-size:15px;cursor:pointer}
.checks input{width:18px;height:18px;margin-top:4px;accent-color:var(--teal);flex:none}
.notice{border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:18px}
.notice b{display:block;margin-bottom:2px}
.notice.warn{background:var(--warn-bg);color:var(--warn-ink)}
.notice.stop{background:var(--stop-bg);color:var(--stop-ink)}
.notice.ok{background:var(--teal-soft);color:var(--teal-ink)}
.notice .btn{margin-top:8px}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 22px;border-top:1px solid var(--line);background:var(--soft);border-radius:0 0 var(--r) var(--r)}
.status-text{font-size:13px;color:var(--muted)}
.foot-btns{display:flex;gap:8px}

/* Side */
.side{display:flex;flex-direction:column;gap:var(--gap)}
.side .panel{padding:16px}
.side h3{font-size:15px;margin:0 0 10px}
.sum{margin:0}
.sum div{padding:8px 0;border-bottom:1px solid var(--line)}
.sum div:last-child{border:0}
.sum dt{font-size:12px;color:var(--muted);font-weight:600}
.sum dd{margin:0;font-size:14px;overflow-wrap:anywhere}
.sum .empty{color:#9aa8a5}
.side .actions{display:flex;flex-direction:column;gap:8px}
.saved{font-size:12px;color:var(--muted);margin-top:8px}

/* Intake type cards */
.types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.type{display:block;text-align:start;border:1px solid var(--bd);background:var(--field);border-radius:12px;padding:12px 14px}
.type b{display:block;font-size:15px}
.type span{display:block;font-size:13px;color:var(--muted)}
.type[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);box-shadow:inset 0 0 0 1px var(--teal)}

/* View switch */
.view-switch{display:inline-flex;background:#1d3a42;border-radius:10px;padding:3px;gap:2px}
.view-switch button{border:0;background:none;color:#cfe0df;border-radius:8px;padding:6px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.view-switch button[aria-pressed="true"]{background:var(--lime);color:var(--navy)}

/* Flowchart view */
.flowpanel{display:none;padding:0;overflow:hidden}
.fc-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.fc-tools .btn{padding:5px 10px;font-size:13px}
.fc-zoom{min-width:48px;text-align:center;font-size:13px;font-weight:600;color:var(--muted)}
.fc-vp{height:calc(100vh - 230px);min-height:520px;overflow:auto;cursor:grab;background-color:var(--card);background-image:radial-gradient(var(--dotc) 1px,transparent 1px);background-size:18px 18px;border-radius:0 0 var(--r) var(--r)}
.fc-vp.drag{cursor:grabbing;user-select:none}
.fc-sizer{position:relative;overflow:hidden;margin:0 auto;direction:ltr}
.fc-sizer .fc{width:560px;padding:24px 0;transform-origin:0 0}
[dir=rtl] .fc-sizer .fc{direction:rtl}
.fc-more{border:1.5px dashed var(--bd);background:var(--card);border-radius:12px;padding:8px 14px;font-size:14px;color:var(--muted)}
.app.flow{grid-template-columns:minmax(0,1fr) minmax(340px,430px)}
.app.flow .stepper{display:none}
.app.flow .flowpanel{display:block}
.app.flow .side{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}
.fc{display:flex;flex-direction:column;align-items:center;min-width:280px}
.fc-arrow{width:2px;height:24px;background:var(--rule);position:relative;flex:none}
.fc-arrow:after{content:"";position:absolute;bottom:-2px;left:-4px;border:5px solid transparent;border-top:6px solid var(--rule);border-bottom:0}
.fc-node{width:min(100%,340px);border:1.5px solid var(--bd);background:var(--field);border-radius:12px;padding:10px 14px;text-align:center;display:block}
.fc-node b{display:block;font-size:15px}
.fc-node small{display:block;font-size:12px;color:var(--muted)}
.fc-node .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--rule);font-size:12px;font-weight:600;color:var(--muted);margin-bottom:2px}
.fc-node.is-done{border-color:var(--teal);background:var(--teal-soft)}
.fc-node.is-done .n{background:var(--teal);border-color:var(--teal);color:#fff}
.fc-node.is-progress{border-color:var(--teal)}
.fc-node.is-locked{opacity:.45;border-style:dashed}
.fc-node[aria-current="step"]{box-shadow:0 0 0 3px #7bd7c4}
.fc-node.ghost{border-style:dashed;color:var(--muted);font-size:14px}
.fc-term{border-radius:99px;padding:7px 18px;background:var(--navy);color:#fff;font-weight:600;font-size:14px}
.fc-term.stop{background:var(--stop-bg);color:var(--stop-ink)}
.fc-term.end{background:var(--teal)}
.fc-dec{display:flex;flex-direction:column;align-items:center;gap:8px}
.fc-diamond{position:relative;width:200px;height:96px;display:grid;place-items:center;text-align:center;font-weight:600;font-size:14px;padding:0 38px;line-height:1.3}
.fc-diamond svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fc-diamond polygon{fill:var(--card);stroke:#7d93c7;stroke-width:1.5;vector-effect:non-scaling-stroke}
.fc-diamond.set polygon{fill:var(--teal-soft);stroke:var(--teal)}
.fc-diamond span{position:relative}
.fc-branches{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:460px}
.fc-branches .choice{font-size:13px;padding:5px 12px}
.fc-loop{font-size:13px;color:var(--warn-ink);background:var(--warn-bg);border:0;border-radius:8px;padding:4px 10px}

/* Toast */
.toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(50%);background:var(--navy);color:#fff;border-radius:12px;padding:10px 14px;display:none;align-items:center;gap:12px;z-index:50;font-size:14px;box-shadow:0 8px 30px #0003}
[dir=ltr] .toast{transform:translateX(-50%)}
.toast.show{display:flex}
.toast button{background:none;border:0;color:var(--lime);font-weight:600;text-decoration:underline}

@media (max-width:1150px){
  .app{grid-template-columns:240px minmax(0,1fr)}
  .side{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}
}
@media (max-width:1150px){
  .app.flow{grid-template-columns:minmax(0,1fr) minmax(300px,380px)}
}
@media (max-width:760px){
  .app.flow{grid-template-columns:minmax(0,1fr)}
  .app.flow .side{grid-template-columns:1fr}
  .app{grid-template-columns:minmax(0,1fr)}
  .stepper{position:static;min-width:0}
  #card,.side{min-width:0}
  .steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;position:relative}
  .phase{display:none}
  .step-btn{white-space:nowrap;border:1px solid var(--line)}
  .step-btn .lbl{display:none}
  .step-btn[aria-current="step"] .lbl{display:inline}
  .meta,.fields,.types{grid-template-columns:1fr}
  .side{grid-template-columns:1fr}
  .card-foot{flex-direction:column;align-items:stretch}
  .foot-btns .btn{flex:1}
}
@media print{
  .top-actions,.stepper,.card-foot,.side .actions,.toast{display:none!important}
  .app{display:block}
  .panel{break-inside:avoid;margin-bottom:12px}
}
</style>
</head>

<header class="top">
  <div class="brand"><div class="mark" aria-hidden="true">D</div><div><b id="tBrand"></b><small id="tBrandSub"></small></div></div>
  <div class="top-actions">
    <div class="view-switch" role="group" id="viewSwitch"><button type="button" data-view="playbook"></button><button type="button" data-view="flow"></button></div>
    <button class="btn ghost icon" id="undoBtn" type="button">↶</button><button class="btn ghost icon" id="redoBtn" type="button">↷</button><button class="btn ghost icon" id="themeBtn" type="button"></button>
    <button class="btn ghost" id="langBtn" type="button"></button>
    <button class="btn ghost" id="newBtn" type="button"></button>
  </div>
</header>

<section class="intro">
  <h1 id="tTitle"></h1>
  <p id="tIntro"></p>
</section>

<main class="app" id="app">
  <nav class="panel stepper" id="stepper" aria-label=""></nav>
  <section class="panel flowpanel" id="flow" aria-label=""></section>
  <section class="panel" id="card" aria-live="polite"></section>
  <aside class="side">
    <section class="panel"><h3 id="tSummary"></h3><dl class="sum" id="summary"></dl></section>
    <section class="panel"><h3 id="tShare"></h3>
      <div class="actions">
        <button class="btn primary" id="copyBtn" type="button"></button>
        <button class="btn" id="dlBtn" type="button"></button>
        <button class="btn" id="printBtn" type="button"></button>
      </div>
      <div class="saved" id="saved"></div>
    </section>
  </aside>
</main>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="toastUndo" type="button"></button></div>

const PATHS = {full:FULL,cr:CR,bug:BUG};

/* ---------- State ---------- */
const KEY='dealapp-process-2027-v3';
const fresh=()=>({lang:'ar',view:'playbook',cur:0,data:{},checks:{},savedAt:null});
let S=load();
let UNDO=[],REDO=[];

function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.data)return Object.assign(fresh(),s)}catch(e){}return fresh()}
function save(){S.savedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
const u=()=>UI[S.lang];
const L=o=>typeof o==='string'?o:(o[S.lang]??o.ar);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function typeObj(){return TYPES.find(t=>t.id===S.data.type)}
function pathKey(){const t=typeObj();return t?t.path:null}
function steps(){const p=pathKey();return [INTAKE].concat(p?PATHS[p]:[])}
function optVal(f,i){return f.values?f.values[i]:String(i)}

function filled(f){const v=S.data[f.id];return v!==undefined&&String(v).trim()!==''}
function missingOf(st){
  const m=[];st.fields.forEach(f=>{if(f.req&&!filled(f))m.push(L(f.label))});
  const c=S.checks[st.id]||[];st.checks.forEach((k,i)=>{if(!c[i])m.push(L(k))});
  // gates that block completion
  if(st.id==='s2'&&S.data.decision&&S.data.decision!=='go')m.push(L(st.fields[3].label)+': '+(S.data.decision==='stop'?L(ch('نتوقف','Stop')):L(ch('نعيد الصياغة','Reframe'))));
  if(st.id==='s5'&&S.data.review==='changes')m.push(L(ch('التصميم غير معتمد','Design not approved')));
  if(st.id==='s9'&&S.data.uat==='changes')m.push(L(ch('صاحب الطلب لم يوافق','Requester has not approved')));
  return m;
}
function started(st){return st.fields.some(filled)||(S.checks[st.id]||[]).some(Boolean)}
function locked(i){const list=steps();const idx2=list.findIndex(s=>s.id==='s2');return idx2>-1&&i>idx2&&S.data.decision==='stop'}
function status(i){const st=steps()[i];if(locked(i))return 'locked';if(!missingOf(st).length)return 'done';return started(st)?'progress':'todo'}

/* ---------- Render ---------- */
function render(){
  const t=u();document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
  $('tBrand').textContent=t.brand;$('tBrandSub').textContent=t.brandSub;$('tTitle').textContent=t.title;$('tIntro').textContent=t.intro;
  $('langBtn').textContent=t.lang;$('newBtn').textContent=t.newReq;$('tSummary').textContent=t.summary;$('tShare').textContent=t.share;
  $('copyBtn').textContent=t.copy;$('dlBtn').textContent=t.dl;$('printBtn').textContent=t.print;$('toastUndo').textContent=t.undo;
  $('stepper').setAttribute('aria-label',t.stepsNav);$('flow').setAttribute('aria-label',t.flowLbl);
  $('viewSwitch').setAttribute('aria-label',t.viewGroup);
  $('viewSwitch').querySelectorAll('button').forEach(b=>{b.textContent=b.dataset.view==='flow'?t.viewFlow:t.viewPlaybook;b.setAttribute('aria-pressed',S.view===b.dataset.view)});
  $('app').classList.toggle('flow',S.view==='flow');
  document.documentElement.dataset.theme=isDark()?'dark':'light';
  $('themeBtn').textContent=isDark()?'☀':'☾';$('themeBtn').setAttribute('aria-label',isDark()?t.light:t.dark);$('themeBtn').title=isDark()?t.light:t.dark;
  $('undoBtn').setAttribute('aria-label',t.undoL);$('undoBtn').title=t.undoL;$('redoBtn').setAttribute('aria-label',t.redoL);$('redoBtn').title=t.redoL;updUndo();
  const list=steps();if(S.cur>=list.length)S.cur=list.length-1;
  renderStepper(list);if(S.view==='flow')renderFlow(list);renderCard(list);renderSummary(list);
  $('saved').textContent=S.savedAt?t.savedAt(new Date(S.savedAt).toLocaleTimeString(S.lang==='ar'?'ar-SA':'en-GB',{hour:'2-digit',minute:'2-digit'})):'';
}

function renderStepper(list){
  const t=u();const total=list.length-1;const doneN=list.filter((_,i)=>i>0&&status(i)==='done').length;const pct=total?Math.round(doneN/total*100):0;
  let h=!total?'':`<div class="progress"><div class="progress-row"><span>${t.progress}</span><span>${doneN} / ${total}</span></div><div class="bar"><span style="width:${pct}%"></span></div></div>`;
  if(pathKey())h+=`<span class="path-tag">${t.pathName[pathKey()]}</span>`;
  let lastPhase='';h+='<ol class="steps">';
  list.forEach((st,i)=>{
    const ph=L(st.phase);if(ph!==lastPhase){h+=`<li class="phase" aria-hidden="true">${esc(ph)}</li>`;lastPhase=ph}
    const s=status(i);const icon=s==='done'?'✓':(i===0?'•':String(i));
    const stLabel={done:t.done,progress:t.inProgress,todo:t.notStarted,locked:t.locked}[s];
    h+=`<li class="is-${s}"><button type="button" class="step-btn" data-i="${i}" ${i===S.cur?'aria-current="step"':''}><span class="dot" aria-hidden="true">${icon}</span><span class="lbl">${esc(L(st.title))}</span><span class="sr">— ${stLabel}</span></button></li>`;
  });
  h+='</ol>';if(!pathKey())h+=`<p class="status-text">${t.chooseType}</p>`;
  $('stepper').innerHTML=h;
  $('stepper').querySelectorAll('.step-btn').forEach(b=>b.onclick=()=>go(+b.dataset.i));
}

function renderFlow(list){
  const t=u();const arrow='<div class="fc-arrow" aria-hidden="true"></div>';
  const idx=id=>list.findIndex(s=>s.id===id);
  const diamond=(q,set,chips)=>`<div class="fc-dec"><div class="fc-diamond ${set?'set':''}"><svg viewBox="0 0 200 96" preserveAspectRatio="none" aria-hidden="true"><polygon points="100,1 199,48 100,95 1,48"/></svg><span>${esc(q)}</span></div><div class="fc-branches" role="group" aria-label="${esc(q)}">${chips}</div></div>`;
  let limit=list.length-1;
  if(!S.showAll){const f=list.findIndex((_,i)=>status(i)!=='done');limit=f===-1?list.length-1:Math.max(f,S.cur);if(status(limit)==='locked'){const i2=list.findIndex(x=>x.id==='s2');limit=Math.max(i2,S.cur)}}
  let h=`<div class="fc-term">${t.start}</div>${arrow}`;
  list.forEach((st,i)=>{
    if(i>limit)return;
    const s=status(i);
    h+=`<button type="button" class="fc-node is-${s}" data-i="${i}" ${i===S.cur?'aria-current="step"':''}><span class="n">${s==='done'?'✓':(i===0?'•':i)}</span><b>${esc(L(st.title))}</b><small>${esc(L(st.owner))}</small></button>`;
    if(i===0){
      const v=S.data.type;
      h+=arrow+diamond(t.typeQ,!!v,TYPES.map(ty=>`<button type="button" class="choice" data-fct="${ty.id}" aria-pressed="${v===ty.id}">${esc(ty[S.lang][0])}</button>`).join(''));
    }
    st.fields.filter(f=>f.dia).forEach(f=>{
      const v=S.data[f.id];
      const chips=f.options.map((o,j)=>{const val=optVal(f,j);const lp=f.loops&&f.loops[val];return `<button type="button" class="choice" data-f="${f.id}" data-v="${esc(val)}" aria-pressed="${v===val}">${esc(L(o))}</button>`}).join('');
      let loop='';const target=f.loops&&v&&f.loops[v];
      if(target==='cycle')loop=`<button type="button" class="fc-loop" data-cycle="1">${t.cycleShort}</button>`;
      else if(target)loop=`<button type="button" class="fc-loop" data-go="${idx(target)}">${t.backShort(idx(target))}</button>`;
      h+=arrow+diamond(L(f.q),!!v,chips+loop);
      if(f.id==='decision'&&v==='stop')h+=arrow+`<div class="fc-term stop">${t.stopTitle}</div>`;
    });
    if(i<list.length-1&&i<limit)h+=arrow;
  });
  const hidden=list.length-1-limit;
  if(!pathKey())h+=arrow+`<div class="fc-node ghost">${t.chooseType}</div>`;
  else if(hidden>0)h+=arrow+`<button type="button" class="fc-more" id="fcMore">${t.more(hidden)}</button>`;
  else h+=arrow+`<div class="fc-term ${list.every((_,i)=>status(i)==='done')?'end':''}">${t.end}</div>`;
  const panel=$('flow');
  if(!$('fcStage')){
    panel.innerHTML=`<div class="fc-tools"><button type="button" class="btn icon" id="zOut">−</button><span class="fc-zoom" id="zLbl"></span><button type="button" class="btn icon" id="zIn">+</button><button type="button" class="btn" id="zFit"></button><button type="button" class="btn" id="zCenter"></button><button type="button" class="btn" id="zAll"></button></div><div class="fc-vp" id="fcVp"><div class="fc-sizer" id="fcSizer"><div class="fc" id="fcStage"></div></div></div>`;
    $('zOut').onclick=()=>setZoom((S.zoom||1)-.1);$('zIn').onclick=()=>setZoom((S.zoom||1)+.1);
    $('zFit').onclick=fitFlow;$('zCenter').onclick=()=>centerFlow(true);
    $('zAll').onclick=()=>{S.showAll=!S.showAll;save();render()};
    enablePan($('fcVp'));
  }
  $('zOut').setAttribute('aria-label',t.zoomOut);$('zIn').setAttribute('aria-label',t.zoomIn);$('zFit').textContent=t.fit;$('zCenter').textContent='◎';$('zCenter').setAttribute('aria-label',t.center);$('zCenter').title=t.center;$('zAll').textContent=S.showAll?t.showNext:t.showAll;
  const el=$('fcStage');el.innerHTML=h;applyZoom();
  const more=$('fcMore');if(more)more.onclick=()=>{S.showAll=true;save();render()};
  el.querySelectorAll('.fc-node[data-i]').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  el.querySelectorAll('[data-fct]').forEach(b=>b.onclick=()=>{snap();S.data.type=S.data.type===b.dataset.fct?'':b.dataset.fct;save();render()});
  el.querySelectorAll('.choice[data-f]').forEach(b=>b.onclick=()=>{snap();const f=b.dataset.f,v=b.dataset.v;S.data[f]=S.data[f]===v?'':v;S.cur=list.findIndex(st=>st.fields.some(x=>x.id===f));save();render()});
  el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
  el.querySelectorAll('[data-cycle]').forEach(b=>b.onclick=newCycle);
}

function applyZoom(){const st=$('fcStage'),sz=$('fcSizer');if(!st)return;const z=S.zoom||1;st.style.transform=`scale(${z})`;sz.style.width=st.offsetWidth*z+'px';sz.style.height=st.offsetHeight*z+'px';$('zLbl').textContent=Math.round(z*100)+'%'}
function setZoom(z){S.zoom=Math.min(1.6,Math.max(.35,Math.round(z*100)/100));save();applyZoom()}
function fitFlow(){const vp=$('fcVp'),st=$('fcStage');if(!vp)return;setZoom(Math.min(1,(vp.clientWidth-24)/st.offsetWidth,(vp.clientHeight-24)/st.offsetHeight));vp.scrollTop=0}
function centerFlow(smooth){const vp=$('fcVp'),n=$('fcStage')&&$('fcStage').querySelector('[aria-current]');if(!vp||!n)return;const z=S.zoom||1;const top=(n.offsetTop+n.offsetHeight/2)*z-vp.clientHeight/2;vp.scrollTo({top,behavior:smooth?'smooth':'auto'})}
function enablePan(vp){let d=null;vp.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.target.closest('button,input,textarea,a'))return;d={x:e.clientX,y:e.clientY,l:vp.scrollLeft,t:vp.scrollTop};vp.setPointerCapture(e.pointerId);vp.classList.add('drag')});vp.addEventListener('pointermove',e=>{if(!d)return;vp.scrollLeft=d.l-(e.clientX-d.x);vp.scrollTop=d.t-(e.clientY-d.y)});const end=()=>{d=null;vp.classList.remove('drag')};vp.addEventListener('pointerup',end);vp.addEventListener('pointercancel',end);vp.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();setZoom((S.zoom||1)-Math.sign(e.deltaY)*.1)}},{passive:false})}

function fieldHTML(f){
  const lab=`<label ${f.kind==='choice'||f.kind==='type'?'':`for="f_${f.id}"`}>${esc(L(f.label))}${f.req?'':` <span class="opt-tag">${u().optional}</span>`}</label>`;
  const v=S.data[f.id]??'';let inner='';
  if(f.kind==='type'){
    inner='<div class="types" role="group">'+TYPES.map(ty=>`<button type="button" class="type" data-type="${ty.id}" aria-pressed="${v===ty.id}"><b>${esc(ty[S.lang][0])}</b><span>${esc(ty[S.lang][1])}</span></button>`).join('')+'</div>';
  }else if(f.kind==='choice'){
    inner='<div class="choices" role="group">'+f.options.map((o,i)=>{const val=optVal(f,i);return `<button type="button" class="choice" data-f="${f.id}" data-v="${esc(val)}" aria-pressed="${v===val}">${esc(L(o))}</button>`}).join('')+'</div>';
  }else if(f.area){
    inner=`<textarea id="f_${f.id}" data-f="${f.id}" placeholder="${esc(f.ph?L(f.ph):'')}">${esc(v)}</textarea>`;
  }else{
    inner=`<input id="f_${f.id}" data-f="${f.id}" type="${f.kind==='date'?'date':'text'}" value="${esc(v)}" placeholder="${esc(f.ph?L(f.ph):'')}">`;
  }
  const hint=f.hint?`<div class="hint">${esc(L(f.hint))}</div>`:'';
  return `<div class="field ${f.full?'full':''}">${lab}${inner}${hint}</div>`;
}

function noticeHTML(st,list){
  const t=u();const idx=n=>list.findIndex(s=>s.id===n);
  if(locked(S.cur))return `<div class="notice stop"><b>${t.stopTitle}</b>${t.stopText}<br><button class="btn" data-go="${idx('s2')}">${t.backTo(idx('s2'))}</button></div>`;
  if(st.id==='s2'&&S.data.decision==='stop')return `<div class="notice stop"><b>${t.stopTitle}</b>${t.stopText}</div>`;
  if(st.id==='s2'&&S.data.decision==='reframe')return `<div class="notice warn"><b>${t.reframeTitle}</b>${t.reframeText}<br><button class="btn" data-go="${idx('s1')}">${t.backTo(idx('s1'))}</button></div>`;
  if(st.id==='s5'&&S.data.review==='changes')return `<div class="notice warn">${t.reviewChanges}<br><button class="btn" data-go="${idx('s4')}">${t.backTo(idx('s4'))}</button></div>`;
  if(st.id==='s9'&&S.data.uat==='changes')return `<div class="notice warn">${t.uatChanges}<br><button class="btn" data-go="${idx('s8')}">${t.backTo(idx('s8'))}</button></div>`;
  if(st.id==='s11'&&S.data.result==='notmet')return `<div class="notice warn"><b>${t.notMet}</b>${t.notMetText}<br><button class="btn primary" id="cycleBtn">${t.newCycle}</button></div>`;
  if(st.id==='s11'&&S.data.result==='met')return `<div class="notice ok"><b>${t.met}</b>${t.metText}</div>`;
  if(pathKey()==='bug'&&st.id==='b2')return `<div class="notice warn">${t.escalate}<br><button class="btn" id="escBtn">${t.escalateBtn}</button></div>`;
  return '';
}

function renderCard(list){
  const t=u();const st=list[S.cur];const s=status(S.cur);const miss=missingOf(st);
  const stLabel={done:t.done,progress:t.inProgress,todo:t.notStarted,locked:t.locked}[s];
  const checks=S.checks[st.id]||[];
  let h=`<div class="card-head"><div class="kicker">${S.cur===0?esc(L(st.phase)):t.stepOf(S.cur,list.length-1)+' · '+esc(L(st.phase))}</div><h2>${esc(L(st.title))}</h2><p>${esc(L(st.desc))}</p></div>`;
  h+=`<div class="meta"><div><small>${t.owner}</small><span>${esc(L(st.owner))}</span></div><div><small>${t.output}</small><span>${esc(L(st.output))}</span></div><div><small>${t.doneWhen}</small><span>${esc(L(st.done))}</span></div></div>`;
  h+=`<div class="card-body">${noticeHTML(st,list)}`;
  if(st.fields.length)h+=`<h3 class="section-label">${t.fieldsLbl}</h3><div class="fields">${st.fields.map(fieldHTML).join('')}</div>`;
  if(st.checks.length)h+=`<h3 class="section-label">${t.checksLbl}</h3><ul class="checks">${st.checks.map((c,i)=>`<li><label><input type="checkbox" data-c="${i}" ${checks[i]?'checked':''} ${locked(S.cur)?'disabled':''}><span>${esc(L(c))}</span></label></li>`).join('')}</ul>`;
  h+='</div>';
  const nextDisabled=S.cur>=list.length-1||locked(S.cur+1);
  const statusLine=s==='done'?`✓ ${t.done}`:(s==='locked'?t.locked:(miss.length?`${t.missing} ${esc(miss.slice(0,2).join('، '))}${miss.length>2?' …':''}`:stLabel));
  h+=`<div class="card-foot"><span class="status-text">${statusLine}</span><div class="foot-btns"><button class="btn" id="prevBtn" ${S.cur===0?'disabled':''}>${S.lang==='ar'?'→':'←'} ${t.prev}</button><button class="btn primary" id="nextBtn" ${nextDisabled?'disabled':''}>${t.next} ${S.lang==='ar'?'←':'→'}</button></div></div>`;
  $('card').innerHTML=h;
  bindCard();
}

function bindCard(){
  const card=$('card');
  card.querySelectorAll('input[data-f],textarea[data-f]').forEach(el=>el.oninput=()=>{if(!el._snapped){snap();el._snapped=true}S.data[el.dataset.f]=el.value;save();renderStepper(steps());if(S.view==='flow')renderFlow(steps());renderSummary(steps());updateFoot()});
  card.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{snap();const f=b.dataset.f,v=b.dataset.v;S.data[f]=S.data[f]===v?'':v;save();render()});
  card.querySelectorAll('.type').forEach(b=>b.onclick=()=>{snap();S.data.type=b.dataset.type;save();render()});
  card.querySelectorAll('input[data-c]').forEach(el=>el.onchange=()=>{snap();const id=steps()[S.cur].id;const arr=S.checks[id]||[];arr[+el.dataset.c]=el.checked;S.checks[id]=arr;save();render()});
  card.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
  const p=$('prevBtn'),n=$('nextBtn');if(p)p.onclick=()=>go(S.cur-1);if(n)n.onclick=()=>go(S.cur+1);
  const c=$('cycleBtn');if(c)c.onclick=newCycle;
  const e=$('escBtn');if(e)e.onclick=()=>{snap();S.data.type='enh';S.cur=1;save();render();toast(UI[S.lang].pathName.full)};
}
function updateFoot(){ // refresh footer status without re-rendering inputs (keeps focus)
  const list=steps(),st=list[S.cur],t=u(),s=status(S.cur),miss=missingOf(st);
  const el=$('card').querySelector('.status-text');if(!el)return;
  el.textContent=s==='done'?`✓ ${t.done}`:(miss.length?`${t.missing} ${miss.slice(0,2).join('، ')}${miss.length>2?' …':''}`:'');
}

function renderSummary(list){
  const t=u();const rows=[];
  const ty=typeObj();
  rows.push([L(INTAKE.fields[0].label),S.data.title]);
  rows.push([L(INTAKE.fields[1].label),ty?ty[S.lang][0]:'']);
  rows.push([L(INTAKE.fields[2].label),S.data.requester]);
  if(pathKey()==='full'){
    rows.push([L(ch('مؤشر النجاح','KPI')),S.data.kpi]);
    rows.push([L(ch('الحالي ← المستهدف','Baseline → target')),[S.data.baseline,S.data.target].filter(Boolean).join(' ← ')]);
    rows.push([L(ch('موعد القياس','Measurement date')),S.data.measureDate]);
  }
  const nextIdx=list.findIndex((_,i)=>status(i)!=='done');
  rows.push([L(ch('الخطوة التالية','Next step')),nextIdx===-1?t.allDone:`${nextIdx?nextIdx+'. ':''}${L(list[nextIdx].title)}`]);
  $('summary').innerHTML=rows.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd class="${v?'':'empty'}">${esc(v||t.empty)}</dd></div>`).join('');
}

/* ---------- Actions ---------- */
function go(i){const list=steps();if(i<0||i>=list.length)return;S.cur=i;save();render();if(S.view==='flow')centerFlow(true);if(window.innerWidth<760)$('card').scrollIntoView({behavior:'smooth',block:'start'});const h=$('card').querySelector('h2');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true})}}
function snapState(){return JSON.stringify({data:S.data,checks:S.checks,cur:S.cur})}
function snap(){UNDO.push(snapState());if(UNDO.length>60)UNDO.shift();REDO=[];updUndo()}
function restore(j){const o=JSON.parse(j);S.data=o.data;S.checks=o.checks;S.cur=o.cur;save();render()}
function undo(){if(!UNDO.length)return;REDO.push(snapState());restore(UNDO.pop());updUndo()}
function redo(){if(!REDO.length)return;UNDO.push(snapState());restore(REDO.pop());updUndo()}
function updUndo(){$('undoBtn').disabled=!UNDO.length;$('redoBtn').disabled=!REDO.length}
$('undoBtn').onclick=undo;$('redoBtn').onclick=redo;
function toast(msg,canUndo){$('toastMsg').textContent=msg;$('toastUndo').style.display=canUndo?'':'none';$('toast').classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>$('toast').classList.remove('show'),canUndo?7000:2500)}
$('toastUndo').onclick=()=>{undo();$('toast').classList.remove('show')};
function newCycle(){
  snap();const ids=['s4','s5','s6','s7','s8','s9','s10','s11'];ids.forEach(id=>delete S.checks[id]);
  ['solution','figma','ab','review','usability','sprint','sprintLen','uat','launchDate','measureDate','rollback','actual','result'].forEach(k=>delete S.data[k]);
  S.cur=steps().findIndex(s=>s.id==='s4');save();render();toast(u().cycleStarted,true);
}
$('newBtn').onclick=()=>{snap();S.data={};S.checks={};S.cur=0;save();render();toast(u().cleared,true)};
function isDark(){return S.theme?S.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
$('themeBtn').onclick=()=>{S.theme=isDark()?'light':'dark';save();render()};
$('viewSwitch').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.view=b.dataset.view;save();render()});
$('langBtn').onclick=()=>{S.lang=S.lang==='ar'?'en':'ar';save();render()};

function summaryText(){
  const t=u(),list=steps(),out=[t.exportTitle,'='.repeat(32)];
  list.forEach((st,i)=>{
    const s=status(i);const sl={done:t.done,progress:t.inProgress,todo:t.notStarted,locked:t.locked}[s];
    out.push('',`${i?i+'. ':''}${L(st.title)} — ${sl}`,`   ${t.owner}: ${L(st.owner)}`);
    st.fields.forEach(f=>{let v=S.data[f.id];if(!v)return;
      if(f.kind==='type'){const ty=TYPES.find(x=>x.id===v);v=ty?ty[S.lang][0]:v}
      else if(f.kind==='choice'){const i2=f.values?f.values.indexOf(v):+v;v=f.options[i2]?L(f.options[i2]):v}
      out.push(`   ${L(f.label)}: ${v}`)});
    const c=S.checks[st.id]||[];st.checks.forEach((k,j)=>out.push(`   [${c[j]?'x':' '}] ${L(k)}`));
  });
  return out.join('\n');
}
$('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(summaryText());toast(u().copied)}catch(e){toast(e.message)}};
$('dlBtn').onclick=()=>{const b=new Blob([summaryText()],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(S.data.title||'dealapp-request').replace(/[\\/:*?"<>|]/g,'-')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast(u().downloaded)};
$('printBtn').onclick=()=>window.print();
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;const k=e.key.toLowerCase();if((e.ctrlKey||e.metaKey)&&k==='z'&&!e.shiftKey){e.preventDefault();undo();return}if((e.ctrlKey||e.metaKey)&&(k==='y'||(k==='z'&&e.shiftKey))){e.preventDefault();redo();return}const fwd=S.lang==='ar'?'ArrowLeft':'ArrowRight',back=S.lang==='ar'?'ArrowRight':'ArrowLeft';if(e.key===fwd&&!$('nextBtn')?.disabled)go(S.cur+1);if(e.key===back&&S.cur>0)go(S.cur-1)});

render();
</script>
